# ==============================================================================
# VendLex Kenya — Render Infrastructure as Code Blueprint (render.yaml)
# Deploys:
#   1. vendlex-api (Node.js Express API Web Service)
#   2. vendlex-postgres (Managed PostgreSQL Database)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. Node.js API Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: vendlex-api
    runtime: node
    region: frankfurt
    plan: starter
    buildCommand: npm install && npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://vendlex.co.ke,https://www.vendlex.co.ke
      - key: DATABASE_URL
        fromDatabase:
          name: vendlex-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_API_SECRET
        generateValue: true
      - key: MPESA_ENVIRONMENT
        value: production
      - key: MPESA_SHORTCODE
        sync: false
      - key: MPESA_CONSUMER_KEY
        sync: false
      - key: MPESA_CONSUMER_SECRET
        sync: false
      - key: MPESA_PASSKEY
        sync: false
      - key: MPESA_CALLBACK_URL
        value: https://api.vendlex.co.ke/api/daraja/callback

# ------------------------------------------------------------------------------
# 2. Managed PostgreSQL Database
# ------------------------------------------------------------------------------
databases:
  - name: vendlex-postgres
    databaseName: vendlex_db
    user: vendlex_admin
    region: frankfurt
    plan: starter
    ipAllowList: [] # Allows access from all Render services within same region
