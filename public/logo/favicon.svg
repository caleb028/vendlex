<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background / Facet Gradients -->
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#087F5B" />
      <stop offset="100%" stop-color="#056B4D" />
    </linearGradient>
    <linearGradient id="navyShadow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F33" />
      <stop offset="100%" stop-color="#061522" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="60%" stop-color="#D4A72C" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <filter id="shieldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#D4A72C" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Gold Arched Handles -->
  <g stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M 68 52 L 68 28 C 68 14, 112 14, 112 28 L 112 52" />
  </g>

  <!-- Gold Outer Border Frame (Variation B2) -->
  <polygon points="32,52 148,52 161,164 19,164" fill="url(#goldGrad)" />

  <!-- Bag Outer Body (Emerald) -->
  <polygon points="35,55 145,55 157,161 23,161" fill="url(#emeraldGrad)" />

  <!-- Bag Corner / Origami Facets (Navy and Deep Emerald) -->
  <polygon points="34,54 62,76 30,105 22,162" fill="url(#navyShadow)" opacity="0.3" />
  <polygon points="146,54 118,76 150,115 158,162" fill="url(#navyShadow)" opacity="0.45" />
  <polygon points="22,162 90,140 158,162" fill="url(#navyShadow)" opacity="0.25" />

  <!-- Grommets / Rivets for handles -->
  <circle cx="68" cy="54" r="4.5" fill="#0B1F33" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="112" cy="54" r="4.5" fill="#0B1F33" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Center Escrow Shield Emblem -->
  <g filter="url(#shieldGlow)" transform="translate(90, 108)">
    <path d="M 0 -34 Q 28 -34 32 -14 C 32 18 10 36 0 42 C -10 36 -32 18 -32 -14 Q -28 -34 0 -34 Z" 
          fill="url(#goldGrad)" />
    <path d="M 0 -29 Q 22 -29 26 -12 C 26 14 8 29 0 34 C -8 29 -26 14 -26 -12 Q -22 -29 0 -29 Z" 
          fill="#056B4D" />
    <path d="M -12 -1 L -3 9 L 14 -11" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="5.5" 
          stroke-linecap="round" 
          stroke-linejoin="round" />
  </g>
</svg>
