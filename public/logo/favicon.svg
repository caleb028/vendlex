<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180" width="100%" height="100%">
  <defs>
    <linearGradient id="favEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="50%" stop-color="#087443" />
      <stop offset="100%" stop-color="#044D2B" />
    </linearGradient>

    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>

    <filter id="favShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#087443" flood-opacity="0.3" />
    </filter>
  </defs>

  <g filter="url(#favShadow)">
    <!-- Bag Handle -->
    <path 
      d="M 68,54 C 68,14 112,14 112,54" 
      fill="none" 
      stroke="url(#favEmerald)" 
      stroke-width="9" 
      stroke-linecap="round" 
    />
    <path 
      d="M 72,50 C 72,20 108,20 108,50" 
      fill="none" 
      stroke="#34D399" 
      stroke-width="2.5" 
      stroke-linecap="round" 
      opacity="0.8"
    />

    <!-- Handle Eyelets -->
    <circle cx="68" cy="56" r="6" fill="url(#favGold)" stroke="#044D2B" stroke-width="1.5" />
    <circle cx="68" cy="56" r="2.5" fill="#FFFFFF" />
    <circle cx="112" cy="56" r="6" fill="url(#favGold)" stroke="#044D2B" stroke-width="1.5" />
    <circle cx="112" cy="56" r="2.5" fill="#FFFFFF" />

    <!-- 3D Bag Side -->
    <polygon 
      points="38,52 56,44 50,135 28,148" 
      fill="#022B18" 
    />

    <!-- Bag Front -->
    <polygon 
      points="54,46 126,46 142,142 38,142" 
      fill="#FFFFFF" 
      stroke="url(#favEmerald)" 
      stroke-width="7" 
      stroke-linejoin="round" 
    />

    <!-- Handshake -->
    <!-- Left Hand (Emerald) -->
    <polygon points="42,75 72,82 64,108 38,96" fill="url(#favEmerald)" />
    <path 
      d="M 68,82 C 84,85 96,93 100,102 C 98,109 88,112 76,107 L 66,105 Z" 
      fill="url(#favEmerald)" 
    />
    <circle cx="80" cy="112" r="3.5" fill="url(#favEmerald)" />
    <circle cx="88" cy="115" r="3.5" fill="url(#favEmerald)" />
    <circle cx="96" cy="117" r="3.5" fill="url(#favEmerald)" />
    <circle cx="104" cy="118" r="3.5" fill="url(#favEmerald)" />

    <!-- Right Hand (Gold) -->
    <polygon points="138,76 108,84 116,110 142,98" fill="url(#favGold)" />
    <path 
      d="M 112,84 C 96,84 82,95 78,103 C 84,110 100,112 112,106 L 118,102 Z" 
      fill="url(#favGold)" 
    />
    <path 
      d="M 94,92 C 100,86 110,90 106,99 C 100,101 90,97 94,92 Z" 
      fill="#FDE047" 
    />
  </g>
</svg>
