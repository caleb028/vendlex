<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="darkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071A13" />
      <stop offset="100%" stop-color="#020B08" />
    </linearGradient>

    <!-- Brand Emerald Gradients -->
    <linearGradient id="emeraldPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#087443" />
    </linearGradient>

    <linearGradient id="emeraldBagSide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="100%" stop-color="#022B18" />
    </linearGradient>

    <!-- Warm Safari Gold Gradients -->
    <linearGradient id="goldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Luminous Filters -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="650" rx="32" fill="url(#darkBg)" />

  <g transform="translate(0, 20)">
    <!-- 1. SHOPPING BAG ICON -->
    <g filter="url(#emeraldGlow)">
      <!-- Bag Handle (Sturdy Arch) -->
      <path 
        d="M 320,170 C 320,60 480,60 480,170" 
        fill="none" 
        stroke="url(#emeraldPrimary)" 
        stroke-width="26" 
        stroke-linecap="round" 
      />
      <!-- Handle Highlight -->
      <path 
        d="M 334,160 C 334,80 466,80 466,160" 
        fill="none" 
        stroke="#6EE7B7" 
        stroke-width="6" 
        stroke-linecap="round" 
        opacity="0.8"
      />

      <!-- Handle Eyelet Rings (Metallic Gold) -->
      <circle cx="320" cy="175" r="16" fill="url(#goldAccent)" stroke="#022B18" stroke-width="4" />
      <circle cx="320" cy="175" r="7" fill="#071A13" />
      <circle cx="480" cy="175" r="16" fill="url(#goldAccent)" stroke="#022B18" stroke-width="4" />
      <circle cx="480" cy="175" r="7" fill="#071A13" />

      <!-- Bag 3D Side Fold -->
      <polygon 
        points="220,165 290,140 270,390 190,425" 
        fill="url(#emeraldBagSide)" 
      />

      <!-- Main Shopping Bag Front Outline -->
      <polygon 
        points="280,145 520,145 570,410 230,410" 
        fill="#042F1E" 
        stroke="url(#emeraldPrimary)" 
        stroke-width="20" 
        stroke-linejoin="round" 
      />

      <!-- Bag Top Rim / Fold Accent Line -->
      <line x1="280" y1="145" x2="520" y2="145" stroke="#34D399" stroke-width="6" stroke-linecap="round" />
      <!-- Bag Bottom Base Shadow Line -->
      <line x1="230" y1="410" x2="570" y2="410" stroke="#022B18" stroke-width="10" stroke-linecap="round" />

      <!-- 2. HANDSHAKE PARTNERSHIP & ESCROW (Inside Bag) -->
      <!-- Left Hand (Emerald Merchant Hand) -->
      <g>
        <polygon points="250,220 340,240 315,310 240,280" fill="url(#emeraldPrimary)" />
        <path 
          d="M 330,240 C 375,250 405,270 415,295 C 410,315 385,325 350,310 L 320,305 Z" 
          fill="url(#emeraldPrimary)" 
        />
        <circle cx="360" cy="325" r="11" fill="url(#emeraldPrimary)" />
        <circle cx="385" cy="335" r="11" fill="url(#emeraldPrimary)" />
        <circle cx="410" cy="342" r="11" fill="url(#emeraldPrimary)" />
        <circle cx="435" cy="345" r="11" fill="url(#emeraldPrimary)" />
      </g>

      <!-- Right Hand (Golden Buyer / Trust Hand) -->
      <g>
        <polygon points="550,225 460,245 485,315 560,285" fill="url(#goldAccent)" />
        <path 
          d="M 470,245 C 420,245 375,275 365,295 C 380,315 425,320 460,305 L 485,295 Z" 
          fill="url(#goldAccent)" 
        />
        <path 
          d="M 410,270 C 425,255 450,265 440,290 C 425,295 400,285 410,270 Z" 
          fill="#FDE047" 
        />
      </g>
    </g>

    <!-- 3. BRAND WORDMARK: VENDLEX -->
    <g transform="translate(400, 520)" text-anchor="middle">
      <text 
        font-family="'Plus Jakarta Sans', 'Inter', 'Segoe UI', system-ui, sans-serif" 
        font-weight="900" 
        font-size="82" 
        letter-spacing="4"
      >
        <tspan fill="#FFFFFF">VEND</tspan><tspan fill="url(#goldAccent)">LEX</tspan>
      </text>

      <!-- Subtitle Badge -->
      <text 
        y="42" 
        font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" 
        font-weight="800" 
        font-size="16" 
        fill="#34D399" 
        letter-spacing="9"
      >KENYA&apos;S COMMERCE ECOSYSTEM</text>
    </g>
  </g>
</svg>
