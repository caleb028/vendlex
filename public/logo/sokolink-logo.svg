<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 180" width="100%" height="100%" fill="none">
  <defs>
    <!-- Clip path for the shopping bag silhouette -->
    <clipPath id="bagShape">
      <path d="M 40 45 C 40 42, 43 40, 47 40 L 133 40 C 137 40, 140 42, 140 45 L 152 165 C 153 169, 149 172, 145 172 L 35 172 C 31 172, 27 169, 28 165 Z" />
    </clipPath>
  </defs>

  <!-- BAG HANDLES (Outside clipping) -->
  <g stroke="#056B38" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M 68 45 L 68 22 C 68 12, 112 12, 112 22 L 112 45" />
  </g>

  <!-- SHOPPING BAG BODY (Clipped) -->
  <g clip-path="url(#bagShape)">
    <!-- Top Green Half -->
    <rect x="0" y="0" width="180" height="110" fill="#056B38" />
    
    <!-- Bottom Red Half -->
    <rect x="0" y="110" width="180" height="75" fill="#C40D18" />

    <!-- Red diagonal/polygon transition to match official artwork -->
    <path d="M 180 62 L 72 62 C 60 62, 52 70, 52 82 C 52 94, 62 102, 74 102 L 180 102 Z" fill="#C40D18" />

    <!-- Stylized White "S" Chain Link Cutout & Highway Ribbon -->
    <!-- Horizontal Left Strip -->
    <path d="M 0 112 L 68 112" stroke="#FFFFFF" stroke-width="12" stroke-linecap="square" />

    <!-- S-Curve Ribbon / Interlocking Chain -->
    <path d="M 180 62 L 80 62 C 64 62, 54 74, 54 88 C 54 102, 66 112, 82 112 L 102 112 C 118 112, 126 122, 126 136 C 126 150, 114 160, 96 160 C 80 160, 70 150, 70 138" 
          stroke="#FFFFFF" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    
    <!-- Chain Link Inner Hole -->
    <ellipse cx="94" cy="138" rx="8" ry="10" fill="#C40D18" />
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g transform="translate(195, 0)">
    <!-- MAIN TITLE: SOKOLINK -->
    <!-- SOKO (Green) -->
    <text x="0" y="98" font-family="'Poppins', 'Segoe UI', 'Montserrat', Arial, sans-serif" font-weight="900" font-size="76" letter-spacing="-1.5" fill="#056B38">
      SOKO
    </text>
    <!-- LINK (Red) -->
    <text x="240" y="98" font-family="'Poppins', 'Segoe UI', 'Montserrat', Arial, sans-serif" font-weight="900" font-size="76" letter-spacing="-1.5" fill="#C40D18">
      LINK
    </text>

    <!-- PRIMARY TAGLINE: CONNECT. SHOP. GROW. -->
    <text x="4" y="132" font-family="'Poppins', 'Segoe UI', 'Montserrat', Arial, sans-serif" font-weight="800" font-size="20.5" letter-spacing="3.8" fill="#056B38">
      CONNECT. SHOP. GROW.
    </text>

    <!-- SECONDARY DESCRIPTOR WITH GOLD FLANKING LINES -->
    <!-- Left Gold Line -->
    <line x1="4" y1="154" x2="48" y2="154" stroke="#D9A441" stroke-width="2.2" stroke-linecap="round" />
    
    <!-- Subtitle Text -->
    <text x="56" y="158" font-family="'Poppins', 'Segoe UI', 'Montserrat', Arial, sans-serif" font-weight="600" font-size="13.5" letter-spacing="0.2" fill="#056B38">
      Kenya&apos;s Business Marketplace &amp; Growth Platform
    </text>

    <!-- Right Gold Line -->
    <line x1="446" y1="154" x2="490" y2="154" stroke="#D9A441" stroke-width="2.2" stroke-linecap="round" />
  </g>
</svg>
