<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 200" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="blueNavyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- LOGO EMBLEM (Left side) -->
  <g transform="translate(20, 15)" filter="url(#dropShadow)">
    <!-- 1. Shopping Basket Base (Deep Navy Sapphire) -->
    <path 
      d="M 35,70 L 125,70 C 130,70 134,74 133,79 L 121,135 C 119,144 111,150 102,150 L 58,150 C 49,150 41,144 39,135 L 27,79 C 26,74 30,70 35,70 Z" 
      fill="url(#blueNavyGrad)" 
    />
    
    <!-- Basket Weave Accent Line -->
    <path 
      d="M 34,95 L 126,95" 
      stroke="#ffffff" 
      stroke-width="3.5" 
      stroke-linecap="round" 
      opacity="0.25" 
    />

    <!-- 2. Basket Handles (Arc) -->
    <path 
      d="M 48,70 C 48,38 112,38 112,70" 
      fill="none" 
      stroke="url(#blueNavyGrad)" 
      stroke-width="10" 
      stroke-linecap="round" 
    />

    <!-- 3. Currency Coin (Golden Wealth Token sitting in basket) -->
    <circle cx="80" cy="108" r="24" fill="url(#goldGrad)" />
    <circle cx="80" cy="108" r="18" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.6" />
    <!-- Currency Symbol ($/KSh Spark inside coin) -->
    <text x="80" y="115" font-family="'Poppins', 'Arial', sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">K</text>

    <!-- 4. Upward Growth Arrow (Emerald Green shooting up through handles) -->
    <path 
      d="M 52,128 L 98,62 L 84,62 L 122,25 L 124,65 L 110,65 L 70,128 Z" 
      fill="url(#emeraldGrad)" 
      filter="url(#softGlow)"
    />
    <!-- Arrow Accent Tip -->
    <path 
      d="M 122,25 L 90,45 L 105,48 Z" 
      fill="#FBBF24" 
    />
  </g>

  <!-- LOGO TEXT (Right side) -->
  <g transform="translate(180, 115)">
    <!-- "Vend" in Obsidian Navy -->
    <text 
      x="0" 
      y="0" 
      font-family="'Poppins', 'Inter', system-ui, sans-serif" 
      font-weight="900" 
      font-size="64" 
      fill="#0F172A" 
      letter-spacing="-1.5"
    >Vend</text>
    
    <!-- "Lex" in Radiant Gold -->
    <text 
      x="165" 
      y="0" 
      font-family="'Poppins', 'Inter', system-ui, sans-serif" 
      font-weight="900" 
      font-size="64" 
      fill="url(#goldGrad)" 
      letter-spacing="-1.5"
    >Lex</text>

    <!-- Subtitle: BUY • SELL • GROW -->
    <text 
      x="5" 
      y="38" 
      font-family="'Poppins', 'Inter', system-ui, sans-serif" 
      font-weight="700" 
      font-size="16" 
      fill="#059669" 
      letter-spacing="4"
    >BUY <tspan fill="#F59E0B">•</tspan> SELL <tspan fill="#F59E0B">•</tspan> GROW</text>
  </g>
</svg>
